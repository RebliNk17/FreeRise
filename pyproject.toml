[project]
name = "freerise"
version = "1.0.0"
description = "Free, self-hosted household finance app for Israeli banks and credit cards"
authors = [
    { name = "Shai Cohen", email = "shai@cohens.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "python-dateutil>=3.0.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
freerise = "freerise.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["vendor/fa_scraper", "vendor/fa_backend_utils"]

[tool.ruff]
line-length = 100
target-version = "py314"

extend-exclude = ["vendor"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
