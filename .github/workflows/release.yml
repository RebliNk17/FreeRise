name: Release

# Pushes to master publish :edge images; a v* tag publishes :<version> and :latest images
# to GHCR and creates a GitHub release.
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: api, context: ., file: Dockerfile.api }
          - { image: worker, context: ., file: Dockerfile.worker }
          - { image: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub as well, once the repo has a DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret.
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # web bakes the API address in at build time; this matches docker-compose.yml.
          build-args: API_URL=http://api:8000
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The page leads with how to run this version (release-notes.md), then the generated
      # changelog; GitHub renames an asset whose name starts with a dot, hence env.example.
      - run: |
          sed "s/{version}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > notes.md
          cp .env.example env.example
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file notes.md --verify-tag \
            docker-compose.prebuilt.yml env.example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
