services:
  postgres:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_DB: freerise
    ports:
      - "127.0.0.1:5432:5432" # this machine only (for local development)
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freerise}:${POSTGRES_PASSWORD:-freerise}@postgres:5432/freerise
    depends_on: [postgres]
    restart: unless-stopped # retries until postgres accepts connections
    ports:
      - "127.0.0.1:8000:8000" # this machine only; the web app reaches it internally

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freerise}:${POSTGRES_PASSWORD:-freerise}@postgres:5432/freerise
    depends_on: [api] # api runs the migrations
    restart: unless-stopped

  web:
    build:
      context: web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports:
      - "${FREERISE_PORT:-3000}:3000" # the address you open: http://localhost:3000

volumes:
  pgdata:
